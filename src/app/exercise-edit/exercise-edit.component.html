<div *ngIf="exercise">
	<h2>Edit Exercise</h2>
	<form [formGroup]="exerciseForm" (ngSubmit)="onSubmit()">
		<div>
			<label for="date">Date:</label>
			<input type="date" id="date" formControlName="date">
		</div>
		
		<div>
			<label for="exerciseType">Type:</label>
			<select id="exerciseType" formControlName="exerciseTypeId">
				<option *ngFor="let type of exerciseTypes" [value]="type.id">
					{{type.typeName}}
				</option>
			</select>
		</div>
		
		<div>
			<label for="duration">Duration:</label>
			<input type="text" id="duration" formControlName="duration">
		</div>
		
		<div>
			<label for="distance">Distance (miles):</label>
			<input type="number" id="distance" formControlName="distance">
		</div>
		
		<div>
			<button type="submit" [disabled]="!exerciseForm.valid">Save</button>
			<button type="button" (click)="cancel()">Cancel</button>
		</div>
	</form>
</div>
